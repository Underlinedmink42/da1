<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Login</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #eaf0f8; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 410px); padding: 32px; border: 1px solid #34445d; border-radius: 18px; background: #1b293d; box-shadow: 0 20px 60px #0005; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .note { color: #bdcbe0; margin: 0 0 24px; font-size: 14px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #52647e; border-radius: 9px; background: #101827; color: white; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px; background: #78aaff; color: #10203a; font: 700 16px system-ui; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 26px; margin-top: 16px; font-size: 14px; }
    .warning { margin-top: 24px; padding: 12px; border-radius: 9px; background: #2c3b50; color: #d5e0ef; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome back</h1>
    <p class="note">Mock login page — demonstration only.</p>
    <form id="login-form">
      <label for="username">Demo username</label>
      <input id="username" name="username" autocomplete="off" required>
      <label for="password">Demo password</label>
      <input id="password" name="password" type="password" autocomplete="off" required>
      <button id="submit" type="submit">Log in</button>
      <div id="result" role="status" aria-live="polite"></div>
    </form>
    <div class="warning">
      This is a practice demo, not a real account service. Use only the sample credentials shown here.
      Do not enter real passwords. Credentials are checked in memory and are not saved.
      <br><br><strong>Sample username:</strong> demo<br><strong>Sample password:</strong> welcome123
    </div>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Checking demo login…";
      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const data = await response.json();
        result.textContent = data.message;
      } catch {
        result.textContent = "Could not contact the demo server. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
